
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le site de Paulin</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #2563eb);
            color: white;
            text-align: center;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .carte {
            background: rgba(255, 255, 255, 0.12);
            padding: 40px 25px;
            border-radius: 20px;
            max-width: 500px;
            margin: 20px;
        }

        h1 {
            font-size: 38px;
        }

        p {
            font-size: 20px;
        }

        button {
            background: white;
            color: #1d4ed8;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #dbeafe;
        }
    </style>
</head>

<body>
    <div class="carte">
        <h1>Bienvenue chez Paulin !</h1>

        <p>Je suis Paulin, c'est mon site ! 😎</p>

        <h2>Amos et Paul, calmez-vous ! 😂</h2>

        <button onclick="alert('Amos et Paul, on se calme ! 😂')">
            Cliquez ici
        </button>
    </div>
</body>
</html>
